<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Я тебя люблю</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#000;color:#fff;font:16px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}footer{position:fixed;left:0;right:0;text-align:center;pointer-events:none}footer{bottom:max(18px,env(safe-area-inset-bottom));font-size:14px}button{pointer-events:auto;min-height:44px;border:1px solid #666;border-radius:30px;padding:0 18px;background:#111d;color:white;font:inherit}

dialog{width:min(92vw,540px);max-height:80dvh;border:1px solid #87516d;border-radius:18px;background:#170e16;color:#fff0f7;padding:18px}dialog::backdrop{background:#000b}dialog header{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog h2{margin:0;font-size:19px}dialog ul{padding:0;margin:12px 0 0;list-style:none}dialog li{padding:10px 0;border-bottom:1px solid #ffffff20;overflow-wrap:anywhere}#readingText{font-size:clamp(20px,5vw,30px);overflow-wrap:anywhere}
</style><canvas tabindex="0" aria-label="Вращающаяся галактика признаний"></canvas><footer><button id="out" aria-label="Отдалить">−</button> <button id="spin">Пауза</button> <button id="in" aria-label="Приблизить">+</button>  <button id="allPhrases">Все фразы</button></footer><dialog id="reader" aria-labelledby="readerTitle"><header><h2 id="readerTitle"></h2><form method="dialog"><button aria-label="Закрыть">×</button></form></header><p id="readingText" dir="auto" hidden></p><ul id="readingList" hidden></ul></dialog><script>
const phrases=["Я тебя люблю","Я тебе кохаю","I love you","Je t’aime","Te amo","Ich liebe dich","Ti amo","Eu te amo","Kocham cię","Miluji tě","Ľúbim ťa","Ik hou van je","Jag älskar dig","Jeg elsker deg","Rakastan sinua","Ég elska þig","Ma armastan sind","Es tevi mīlu","Aš tave myliu","Szeretlek","Te iubesc","Обичам те","Σ’ αγαπώ","Seni seviyorum","Volim te","Ljubim te","Të dua","Я цябе кахаю","Ես քեզ սիրում եմ","მიყვარხარ","Mən səni sevirəm","Мен сені жақсы көремін","Men seni sevaman","دوستت دارم","أحبكِ","אני אוהב אותך","मैं तुमसे प्यार करता हूँ","আমি তোমাকে ভালোবাসি","म तिमीलाई माया गर्छु","ฉันรักเธอ","Yêu em","Aku cinta kamu","Mahal kita","我爱你","愛してるよ","사랑해","Би чамд хайртай","Nakupenda","Ngiyakuthanda","Ek is lief vir jou","Is breá liom thú","Dw i’n dy garu di","T’estimo","Maite zaitut","Quérote","Mi amas vin","Jeg elsker dig","Eg elskar deg","Eg elski teg","Ik hâld fan dy","Ech hunn dech gär","Inħobbok","Tha gaol agam ort","My a’th kar","Me az kar","T’aimi","Te voeuri ben","Te vojo ben","Ich ha di gär","Iech han dich jään","Те сакам","Ман туро дӯст медорам","Мен сени сүйөм","Men seni söýýärin","Мин сине яратам","Мин һине яратам","مەن سېنى سۆيىمەن","میں تم سے محبت کرتا ہوں","زه له تا سره مینه لرم","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","હું તને પ્રેમ કરું છું","मी तुझ्यावर प्रेम करतो","আমি তোমাক ভাল পাওঁ","ମୁଁ ତୁମକୁ ଭଲ ପାଏ","నేను నిన్ను ప్రేమిస్తున్నాను","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","நான் உன்னைக் காதலிக்கிறேன்","မင်းကိုချစ်တယ်","ຂ້ອຍຮັກເຈົ້າ","ខ្ញុំស្រឡាញ់អ្នក","Wa ai li","Aku tresna karo kowe","Abdi bogoh ka anjeun","Gihigugma tika","Ay-ayaten ka","Palangga ta ka","Hau hadomi ó","Aroha ahau ki a koe","Aloha au iā ʻoe","Ou te alofa ia te oe","ʻOku ou ʻofa atu kiate koe","Au domoni iko","Ua here au ia oe","Mi laikim yu","Mi lavem yu","Mwen renmen ou","Mi luv yuh","Mi stima bo","Rohayhu","Kuyayki","Nimitztlazohtla","ᎬᎨᏳᎢ","Asavakkit","እወድሻለሁ","Waan ku jeclahay","Sin jaalladha","Ndagukunda","Nalingi yo","Nkwagala","Ndiyakuthanda","Ndokuda","Kea u rata","Ke a go rata","Ndimakukonda","Mo nífẹ̀ẹ́ rẹ","A hụrụ m gị n’anya","Ina son ki","Dama la bëgg","Me dɔ wo","Melɔ̃ wò","Tiako ianao","Mo kontan twa","Mon kontan ou","איך האָב דיך ליב","Ez ji te hez dikim","خۆشم دەوێیت","Kuv hlub koj","Me amas tu","Te diligo"];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const reader=document.querySelector('#reader');
const readerTitle=document.querySelector('#readerTitle');
const readingText=document.querySelector('#readingText');
const readingList=document.querySelector('#readingList');
const allPhrases=document.querySelector('#allPhrases');
let labelTargets=[];
for(const phrase of phrases){
 const entry=document.createElement('li');
 entry.dir='auto';entry.textContent=phrase;
 readingList.append(entry);
}
function openReader(phrase){
 readerTitle.textContent=phrase?'Признание':'Все признания';
 readingText.hidden=!phrase;
 readingText.textContent=phrase??'';
 readingList.hidden=Boolean(phrase);
 reader.showModal();
 reader.scrollTop=0;
 requestFrame();
}
allPhrases.onclick=()=>openReader();
reader.addEventListener('close',requestFrame);
const tau=Math.PI*2;
let w,h,angle=0,tilt=.46,zoom=1,previous=0;
let spin=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){
 w=innerWidth;h=innerHeight;const scale=Math.min(2,devicePixelRatio||1,Math.sqrt(2200000/Math.max(1,w*h)));
 canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
 ctx.setTransform(scale,0,0,scale,0,0);
}
resize();
addEventListener('resize',()=>{resize();requestFrame();});
const stars=Array.from({length:1900},()=>{
 const y=2*Math.random()-1, a=Math.random()*tau, radius=Math.sqrt(1-y*y);
 return {p:[radius*Math.cos(a),y,radius*Math.sin(a)],size:.55+Math.random()**4*1.85};
});
function point(r,a,y){return [r*Math.cos(a),y,r*Math.sin(a)];}
const armCount=3;
const galaxyRadius=1.83;
function spiralPoint(arm, radius, spread=0, height=0){
 const angle=arm*tau/armCount+4.45*radius+spread;
 return point(radius*galaxyRadius,angle,height);
}
const dust=Array.from({length:900},(_,i)=>{
 const radius=Math.sqrt(Math.random());
 const spread=(Math.random()+Math.random()-1)*.82;
 return spiralPoint(i%armCount,radius,spread,(Math.random()-.5)*.12);
});
const words=phrases.slice(1).map((label,i)=>{
 const arm=i%armCount, step=Math.floor(i/armCount);
 const steps=Math.ceil((phrases.length-1-arm)/armCount);
 const radius=Math.sqrt(.12+.88*(step+.45)/steps);
 const spread=.20*Math.sin(step*2.4+arm);
 const height=.32*Math.sin(step*2.4+arm)+.14*Math.cos(step*.61+arm*2);
 return {label,p:spiralPoint(arm,radius,spread,height)};
});
function viewScale(){return Math.max(1,Math.min(w*.55,(h-85)*.58)*1.12)/galaxyRadius;}
const pointers=new Map();
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const hearts=Array.from({length:23},(_,i)=>
 spiralPoint(i%armCount,.18+.8*(i+.5)/23,.25*Math.sin(i),.05*Math.cos(i)));
const sparks=[];
let tap=null;
function paintHeart(x,y,size,opacity){
 ctx.globalAlpha=opacity;
 ctx.fillStyle='#ff86bb';
 ctx.beginPath();
 ctx.moveTo(x,y+size*.75);
 ctx.bezierCurveTo(x-size*1.45,y-size*.15,x-size*.55,y-size,x,y-size*.32);
 ctx.bezierCurveTo(x+size*.55,y-size,x+size*1.45,y-size*.15,x,y+size*.75);
 ctx.fill();
 ctx.globalAlpha=1;
}
const spinButton=document.querySelector('#spin');
function syncSpin(){spinButton.textContent=spin?'Пауза':'Продолжить';}
spinButton.onclick=()=>{spin=!spin;syncSpin();requestFrame();};
syncSpin();
function changeZoom(factor){zoom=Math.max(.30,Math.min(4,zoom*factor));requestFrame();}
document.querySelector('#out').onclick=()=>changeZoom(1/1.25);
document.querySelector('#in').onclick=()=>changeZoom(1.25);
canvas.addEventListener('wheel',e=>{
 e.preventDefault();
 const units=e.deltaMode===1?16:e.deltaMode===2?h:1;
 changeZoom(Math.exp(-e.deltaY*units*.0014));
},{passive:false});
function distance(){
 const [a,b]=pointers.values();
 return Math.hypot(a.x-b.x,a.y-b.y);
}
canvas.onpointerdown=e=>{
 if(e.button!==0||pointers.size>=2)return;
 tap=pointers.size?null:{id:e.pointerId,x:e.clientX,y:e.clientY};
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 canvas.setPointerCapture(e.pointerId);
};
canvas.onpointermove=e=>{
 if(tap?.id===e.pointerId&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap=null;
 const previousPoint=pointers.get(e.pointerId);
 if(!previousPoint)return;
 const before=pointers.size===2?distance():0;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){
  if(before>1)changeZoom(distance()/before);
  return;
 }
 angle+=(e.clientX-previousPoint.x)*.009;
 tilt+=(e.clientY-previousPoint.y)*.008;
 requestFrame();
};
canvas.onpointerup=e=>{
 if(tap?.id===e.pointerId){
  let picked=null,best=Infinity;
  for(const target of labelTargets){
   const dx=e.clientX-target.x,dy=e.clientY-target.y;
   const starDistance=Math.hypot(dx,dy);
   const onText=Math.abs(dx)<=target.halfWidth+3&&dy<=-2&&dy>=-target.font-8;
   const score=starDistance<=12?starDistance:onText?12+Math.abs(dy):Infinity;
   if(score<best){best=score;picked=target;}
  }
  if(picked){openReader(picked.label);tap=null;pointers.delete(e.pointerId);return;}
 }
 if(tap?.id===e.pointerId&&!reducedMotion.matches){
  for(let i=0;i<9;i++){
   const a=i*tau/9;
   sparks.push({x:e.clientX,y:e.clientY,a,born:performance.now(),size:3+i%3});
  }
 }
 tap=null;pointers.delete(e.pointerId);requestFrame();
};
canvas.onpointercancel=canvas.onlostpointercapture=e=>{
 if(tap?.id===e.pointerId)tap=null;
 pointers.delete(e.pointerId);requestFrame();
};
canvas.onkeydown=e=>{
 const steps={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.15],ArrowDown:[0,.15]};
 if(!steps[e.key])return;e.preventDefault();
 angle+=steps[e.key][0];tilt+=steps[e.key][1];requestFrame();
};
let pendingFrame=0;
function requestFrame(){
 if(!pendingFrame&&!document.hidden)pendingFrame=requestAnimationFrame(draw);
}
document.addEventListener('visibilitychange',()=>{previous=0;requestFrame();});
const textSprites=new Map();
const spriteFont=32;
function spriteFor(label,central){
 const key=central?'center:'+label:label;
 if(textSprites.has(key))return textSprites.get(key);
 const image=document.createElement('canvas');
 const ink=image.getContext('2d');
 ink.font=spriteFont+'px system-ui';
 const width=ink.measureText(label).width;
 image.width=Math.ceil(width)+16;image.height=60;
 ink.font=spriteFont+'px system-ui';
 ink.textAlign='center';ink.textBaseline='bottom';
 ink.strokeStyle='#000d';ink.lineWidth=5;ink.lineJoin='round';
 ink.fillStyle=central?'#ffd1e6':'#fff';
 ink.strokeText(label,image.width/2,46);
 ink.fillText(label,image.width/2,46);
 const sprite={image,width};
 textSprites.set(key,sprite);
 return sprite;
}
function draw(time){
 pendingFrame=0;
 const rotating=spin&&!pointers.size&&!reader.open&&!document.hidden;
 if(rotating&&previous)angle+=Math.min(40,time-previous)*.000075;
 previous=rotating?time:0;
 const x=w/2,y=(h-85)/2,r=viewScale()*zoom,ca=Math.cos(angle),sa=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt);
 function project([a,b,c]){
  const u=a*ca-c*sa,v=a*sa+c*ca,z=b*ct+v*st,k=5/(5-z);
  return {x:x+r*u*k,y:y+r*(b*st-v*ct)*k,z,k};
 }
 ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
 const glowRadius=Math.max(36,Math.min(170,r*.52));
 const glow=ctx.createRadialGradient(x,y,0,x,y,glowRadius);
 glow.addColorStop(0,'#74264d75');
 glow.addColorStop(.48,'#38112540');
 glow.addColorStop(1,'#21071300');
 ctx.fillStyle=glow;
 ctx.fillRect(x-glowRadius,y-glowRadius,glowRadius*2,glowRadius*2);
 const focal=Math.max(w,h)*.70;
 for(const {p:[a,b,c],size} of stars){
  const u=a*ca-c*sa,v=a*sa+c*ca,depth=b*ct+v*st;
  if(depth<=.12)continue;
  const sx=x+focal*u/depth,sy=y+focal*(b*st-v*ct)/depth;
  if(sx<0||sx>w||sy<0||sy>h)continue;
  ctx.fillStyle=size>1.4?'#ffffffe0':'#ffffff75';
  ctx.fillRect(sx,sy,size,size);
 }
 ctx.fillStyle='#ffffff55';
 ctx.beginPath();
 for(const [a,b,c] of dust){
  const u=a*ca-c*sa,v=a*sa+c*ca,z=b*ct+v*st,k=5/(5-z);
  const px=x+r*u*k,py=y+r*(b*st-v*ct)*k;
  if(px<-2||px>w+2||py<-2||py>h+2)continue;
  const radius=k*1.07;
  ctx.moveTo(px+radius,py);ctx.arc(px,py,radius,0,tau);
 }
 ctx.fill();
 const labels=words.map(({p,label})=>({...project(p),label}));
 labels.push({...project([0,0,0]),label:phrases[0],central:true});
 ctx.fillStyle='#fffffff0';
 ctx.beginPath();
 for(const star of labels){
  if(star.x<0||star.x>w||star.y<0||star.y>h)continue;
  const radius=1.4*star.k;
  ctx.moveTo(star.x+radius,star.y);ctx.arc(star.x,star.y,radius,0,tau);
 }
 ctx.fill();
 for(const [i,p] of hearts.entries()){
  const d=project(p);
  if(d.x<0||d.x>w||d.y<0||d.y>h)continue;
  const pulse=reducedMotion.matches||!spin?1:1+.17*Math.sin(time*.002+i);
  paintHeart(d.x,d.y,Math.min(7,3.5*d.k*Math.sqrt(zoom))*pulse,.46);
 }
 labelTargets=[];
 for(const star of labels){
  const font=(star.central?11:Math.max(6,Math.min(8,w/105)))*zoom*star.k;
  const labelY=star.y-5;
  if(labelY+font<0||labelY-font*2>h)continue;
  const sprite=spriteFor(star.label,star.central);
  const scale=font/spriteFont, halfWidth=sprite.width*scale/2;
  if(star.x+halfWidth+8<0||star.x-halfWidth-8>w)continue;
  labelTargets.push({...star,font,halfWidth});
  const {image}=sprite;
  ctx.globalAlpha=star.central||star.z>0?1:.87;
  ctx.drawImage(image,star.x-image.width*scale/2,labelY-46*scale,image.width*scale,image.height*scale);
 }
 ctx.globalAlpha=1;
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i], progress=Math.max(0,(time-s.born)/820);
  if(progress>=1){sparks.splice(i,1);continue;}
  const distance=12+57*progress;
  paintHeart(s.x+Math.cos(s.a)*distance,s.y+Math.sin(s.a)*distance-18*progress,s.size,1-progress);
 }
 if(rotating||sparks.length&&!reader.open)requestFrame();
}
requestFrame();
</script></html>
